[package]
name = "headroom"
description = "Claude usage in your Mac menu bar"
license = "Apache-2.0"
version = "1.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
tokio = { version = "1", features = ["time", "sync", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
plist = "1"
objc2-foundation = { version = "0.3", features = ["NSSet", "NSString", "NSAttributedString", "NSDictionary", "NSValue", "NSURL", "NSGeometry", "NSArray", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNNotificationAttachment", "UNNotificationAction", "UNNotificationCategory", "block2"] }
block2 = "0.6"
objc2-speech = { version = "0.3", features = ["SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionTask", "SFSpeechRecognitionResult", "SFTranscription", "block2"] }
objc2-avf-audio = { version = "0.3", features = ["AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSToolbar", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSFont", "NSColor", "NSAttributedString", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSGraphics", "NSPanel", "NSSavePanel"] }

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = { version = "0.15", default-features = false }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Wdk_System_Threading",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
] }

[profile.release]
strip = true
lto = true
