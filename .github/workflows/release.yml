name: Release

# Push a version tag (e.g. v0.2.0) and this builds Headroom for both Apple Silicon and Intel Macs, then publishes it as
# a GitHub release. The running app checks that release's latest.json once a day to know when there's an update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A universal build needs both targets installed
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Apple signing is optional. Without these secrets the app still builds, it's just unsigned and users have to
      # get past Gatekeeper the first time they open it. We only export the secrets that are actually set, so the
      # build doesn't try to sign with empty values.
      - name: Load Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              { echo "$name<<SECRET_EOF"; echo "${!name}"; echo "SECRET_EOF"; } >> "$GITHUB_ENV"
            fi
          done

      # TAURI_SIGNING_PRIVATE_KEY signs the update itself (separate from Apple signing). The app refuses any update
      # that wasn't signed with it, so this one isn't optional.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Headroom ${{ github.ref_name }}
          releaseBody: Download the .dmg below. See the README for install steps.
          releaseDraft: false
          tauriScript: npx tauri
          args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
